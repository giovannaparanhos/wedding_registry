<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maria Júlia & Roberto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #f5f1e8;
      color: #1e2a44;
      min-height: 100vh;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
      position: relative;
      border-bottom: 0.5px solid rgba(0,0,0,0.25);
    }

    .names {
      font-family: 'Cormorant', serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 75px;
      font-weight: 300;
      line-height: 1.1;
      color: #1e2a44;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .names .connector {
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 40px;
      line-height: 1;
      margin: -8px 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin: 1.5rem 0 1rem;
      color: #1e2a44;
      font-size: 14px;
    }
    .page-subtitle {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: #1e2a44;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .divider-line {
      width: 72px;
      height: 0.5px;
      background: rgba(0,0,0,0.4);
    }

    .date-location {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 13px;
      color: #1e2a44;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Countdown ── */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 2.5rem 1.5rem;
      max-width: 480px;
      margin: 0 auto;
      border-bottom: 0.5px solid rgba(0,0,0,0.2);
    }

    .count-card {
      border: 0.5px solid rgba(0,0,0,0.35);
      border-radius: 10px;
      padding: 1.25rem 0.75rem;
      text-align: center;
      background: rgba(255,255,255,0.15);
    }

    .count-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 300;
      color: #1e2a44;
      line-height: 1;
    }

    .count-label {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 9px;
      color: rgba(0,0,0,0.6);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 6px;
    }

    /* ── Sections ── */
    .section {
      padding: 2.5rem 1.5rem;
      max-width: 620px;
      margin: 0 auto;
      border-bottom: 0.5px solid rgba(0,0,0,0.15);
    }

    .section-title {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(0,0,0,0.55);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-card {
      background: #EDE6F5;
      border: none;
      border-radius: 12px;
      padding: 1.4rem 1.25rem;
    }

    .cal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .cal-btn {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #1e2a44;
      background: rgba(0,0,0,0.08);
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .cal-btn:hover { background: rgba(0,0,0,0.15); }

    .maps-link {
      display: inline-block;
      margin-top: 8px;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #1e2a44;
      text-decoration: none;
      border-bottom: 0.5px solid rgba(0,0,0,0.3);
      transition: opacity 0.15s;
    }
    .maps-link:hover { opacity: 0.6; }

    .info-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 500;
      color: #1e2a44;
      margin-bottom: 5px;
    }

    .info-card-text {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: #2a2a2a;
      line-height: 1.7;
    }

    /* ── RSVP ── */
    .rsvp-section {
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .rsvp-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 400;
      font-style: italic;
      color: #1e2a44;
      margin-bottom: 0.4rem;
    }

    .rsvp-sub {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: rgba(0,0,0,0.6);
      margin-bottom: 1.75rem;
      letter-spacing: 0.04em;
    }

    .rsvp-card {
      background: #EDE6F5;
      border-radius: 14px;
      padding: 1.75rem 1.5rem;
      text-align: left;
    }

    .rsvp-input {
      width: 100%;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 14px;
      padding: 11px 14px;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      background: #fff;
      color: #1e2a44;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    .rsvp-input:focus { border-color: rgba(0,0,0,0.5); }

    .rsvp-btn-primary {
      width: 100%;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #1e2a44;
      color: #f5f0ea;
      border: none;
      border-radius: 8px;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .rsvp-btn-primary:hover { opacity: 0.8; }

    .rsvp-step { display: none; }
    .rsvp-step.active { display: block; }

    .rsvp-step-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-style: italic;
      color: #1e2a44;
      margin-bottom: 1rem;
      text-align: center;
    }

    .rsvp-found {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      color: rgba(0,0,0,0.45);
      text-align: center;
      margin-bottom: 1rem;
    }

    .rsvp-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rsvp-opt-btn {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.08em;
      border: 0.5px solid rgba(0,0,0,0.22);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      background: transparent;
      transition: background 0.15s, border-color 0.15s;
      text-align: center;
    }
    .rsvp-opt-btn:hover { background: rgba(0,0,0,0.05); }
    .rsvp-opt-btn.yes:hover { background: #1e2a44; color: #f5f0ea; border-color: #1e2a44; }

    .nota {
      margin-top: 1.25rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(0,0,0,0.45);
      text-align: center;
    }

    .after-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 0.5px solid rgba(0,0,0,0.12);
      text-align: center;
    }

    .after-title {
      font-family: 'Cormorant', serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 20px;
      color: #1e2a44;
      margin-bottom: 0.5rem;
    }

    .after-text {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: rgba(0,0,0,0.55);
      letter-spacing: 0.04em;
    }

    .rsvp-thanks {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: #1e2a44;
      line-height: 1.7;
      text-align: center;
    }

    /* ── Footer ── */
    .footer {
      padding: 2rem 1.5rem;
      text-align: center;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: rgba(0,0,0,0.45);
      letter-spacing: 0.1em;
      border-top: 0.5px solid rgba(0,0,0,0.2);
    }

    /* ── Desktop ── */
    @media (min-width: 768px) {
      .info-grid { grid-template-columns: 1fr; }
      .info-card-full { grid-column: span 1 !important; }
      .hero-label    { font-size: 13px; }
      .names         { font-size: 108px; }
      .names .connector { font-size: 66px; }
      .date-location { font-size: 15px; }
      .count-number  { font-size: 42px; }
      .count-label   { font-size: 11px; }
      .section-title { font-size: 12px; }
      .info-card-title { font-size: 20px; }
      .info-card-text  { font-size: 14px; }
      .maps-link, .cal-btn { font-size: 13px; }
      .rsvp-title    { font-size: 32px; }
      .rsvp-sub      { font-size: 14px; }
      .rsvp-input    { font-size: 16px; }
      .after-title   { font-size: 44px; }
      .after-text    { font-size: 14px; }
      .rsvp-thanks   { font-size: 22px; }
      .footer        { font-size: 13px; }
    }

  </style>
</head>
<body>

  <div class="hero">
    <div class="names-block">
      <a class="back-link" href="index.html">← voltar</a>
      <div class="names" href="index.html">
        <span>Maria Júlia</span>

    </div>

    <div class="divider">
      <div class="divider-line"></div>

    </div>

    <div class="date-location">12 de dezembro de 2026 &nbsp;·&nbsp; Itaúna</div>
  </div>

  <div class="section">
    <div class="page-subtitle">Onde Ficar</div>
    <div class="after-section">
      <div class="after-title">Hotéis</div>
      <div class="after-text">
        <a href="https://www.booking.com/Share-pl55V0r" target="_blank">Ibis Styles (Centro)</a></br>
        <a href="http://www.grandehotelitauna.com.br/site/" target="_blank">Grande Hotel (Centro)</a><br>
        <a href="http://www.grandehotelitauna.com.br/site/" target="_blank">Granja Glória (Zona Rural)</a><br>
        <a href="https://www.booking.com/Share-DiC3Rly" target="_blank">Hotel Lago do Sol (Barragem, all-inclusive)</a>
      </div>
    </div>

    <div class="after-section">
      <div class="after-title">Maquiagem</div>
      <div class="after-text">lista aqui</div>
    </div>

    <div class="after-section">
      <div class="after-title">Cabelo</div>
      <div class="after-text">cabeleileila leila</div>
    </div>

  <div class="footer">Feito com amor &nbsp;·&nbsp; Roberto & Maria Júlia</div>



</body>
</html>
