name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject private data
        env:
          PIX_KEY: ${{ secrets.PIX_KEY }}
          PIX_NAME: ${{ secrets.PIX_NAME }}
          ADDRESS: ${{ secrets.ADDRESS }}
          RECEPTION_ADDRESS: ${{ secrets.RECEPTION_ADDRESS }}
          RECEPTION_MAPS_URL: ${{ secrets.RECEPTION_MAPS_URL }}
          PARTY_NAME: ${{ secrets.PARTY_NAME }}
          PARTY_ADDRESS: ${{ secrets.PARTY_ADDRESS }}
          PARTY_MAPS_URL: ${{ secrets.PARTY_MAPS_URL }}
        run: |
          esc() { printf '%s' "$1" | sed 's/[&\]/\\&/g'; }
          sed -i \
            -e "s|%%PIX_KEY%%|$(esc "$PIX_KEY")|g" \
            -e "s|%%PIX_NAME%%|$(esc "$PIX_NAME")|g" \
            -e "s|%%ADDRESS%%|$(esc "$ADDRESS")|g" \
            presentes.html
          sed -i \
            -e "s|%%RECEPTION_ADDRESS%%|$(esc "$RECEPTION_ADDRESS")|g" \
            -e "s|%%RECEPTION_MAPS_URL%%|$(esc "$RECEPTION_MAPS_URL")|g" \
            -e "s|%%PARTY_NAME%%|$(esc "$PARTY_NAME")|g" \
            -e "s|%%PARTY_ADDRESS%%|$(esc "$PARTY_ADDRESS")|g" \
            -e "s|%%PARTY_MAPS_URL%%|$(esc "$PARTY_MAPS_URL")|g" \
            index.html
          sed -i \
            -e "s|%%RECEPTION_ADDRESS%%|$(esc "$RECEPTION_ADDRESS")|g" \
            evento.ics

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
