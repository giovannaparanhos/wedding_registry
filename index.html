<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giovanna & Caio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: #048279;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .photo-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .caption {
      text-align: center;
    }

    .names {
      font-family: 'Snell Roundhand', 'Pinyon Script', cursive;
      font-size: 72px;
      line-height: 1.15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .names .connector {
      font-family: 'Snell Roundhand', 'Pinyon Script', cursive;
      font-size: 44px;
      line-height: 1;
      margin: -6px 0;
    }

    .date {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .names { font-size: 56px; }
      .names .connector { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="photo-wrap">
    <div class="caption">
      <div class="names">
        <span>Giovanna</span>
        <span class="connector">&</span>
        <span>Caio</span>
      </div>
      <div class="date">09 de julho de 2026</div>
    </div>

    <div class="photo-frame">
      <img src="us.jpg" alt="Giovanna e Caio">
    </div>
  </div>

</body>
</html>
